appId: com.flex.app
---
# Flow: Profile settings — training profile hub screenshot for design audit
# Run from repo root:
#   maestro test -p ios apps/mobile/src/e2e_tests/profile/captureTrainingProfileScreenshot.flow.maestro.yaml
#   maestro test -p android apps/mobile/src/e2e_tests/profile/captureTrainingProfileScreenshot.flow.maestro.yaml
# Copy Maestro output (training_profile_1.png) after each platform run:
#   design/implementationValidation/profileSettings/trainingProfile/session_{SESSION_TS}/finalAudit/trainingProfile_{AUDIT_TS}/training_profile_1_{ios|android}.png

- launchApp
- runFlow:
    when:
      visible:
        id: 'today-screen'
    commands:
      - assertVisible:
          id: 'today-screen'
- runFlow:
    when:
      visible:
        id: 'landing-screen'
    commands:
      - runFlow:
          file: ../auth/loginWithTestCredentials.subflow.maestro.yaml
- runFlow:
    when:
      visible:
        id: 'login-screen'
    commands:
      - runFlow:
          file: ../auth/loginWithTestCredentials.subflow.maestro.yaml
- tapOn:
    text: 'Profile'
- assertVisible:
    id: 'training-profile-screen'
- assertVisible:
    id: 'training-profile-title'
- takeScreenshot: training_profile_1
