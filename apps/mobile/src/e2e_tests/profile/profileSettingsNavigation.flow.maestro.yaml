appId: com.flex.app
---
# Flow test: Profile tab → Appearance and Gym locations settings
# Run: maestro test apps/mobile/src/e2e_tests/profile/profileSettingsNavigation.flow.maestro.yaml

- launchApp
- runFlow:
    when:
      visible:
        id: 'today-screen'
    commands:
      - assertVisible:
          id: 'today-screen'
- runFlow:
    when:
      visible:
        id: 'landing-screen'
    commands:
      - runFlow:
          file: ../auth/loginWithTestCredentials.subflow.maestro.yaml
- runFlow:
    when:
      visible:
        id: 'login-screen'
    commands:
      - runFlow:
          file: ../auth/loginWithTestCredentials.subflow.maestro.yaml
- tapOn:
    text: 'Profile'
- assertVisible:
    id: 'training-profile-screen'
- assertVisible:
    id: 'training-profile-title'
- assertVisible:
    id: 'profile-row-goals'
- assertVisible:
    id: 'profile-row-gym-locations'
- tapOn:
    id: 'profile-row-appearance'
- assertVisible:
    id: 'appearance-screen'
- back
- tapOn:
    id: 'profile-row-gym-locations'
- assertVisible:
    id: 'gym-locations-list-screen'
- back
- tapOn:
    id: 'profile-row-wellness'
- assertVisible:
    id: 'wellness-overview-screen'
- back
- tapOn:
    id: 'profile-row-goals'
- assertVisible:
    id: 'goals-and-schedule-screen'
