appId: com.flex.app
env:
  E2E_EMAIL: ${MAESTRO_E2E_EMAIL || E2E_TEST_EMAIL || E2E_EMAIL}
  E2E_PASSWORD: ${MAESTRO_E2E_PASSWORD || E2E_TEST_PASSWORD || E2E_PASSWORD}
---
# Reusable auth subflow — signs in from Landing or Login.
# Credentials: e2e.env (local), MAESTRO_E2E_* / E2E_TEST_* shell vars, or maestro -e.
# Does not launch the app; parent flow should call launchApp first.

- runFlow:
    when:
      visible:
        id: 'landing-screen'
    commands:
      - tapOn:
          text: 'Log in'

- assertVisible:
    id: 'login-screen'

- tapOn:
    text: 'Email'
- inputText: ${E2E_EMAIL}

- tapOn:
    text: 'Password'
- inputText: ${E2E_PASSWORD}

- hideKeyboard

- tapOn:
    id: 'login-submit'

- extendedWaitUntil:
    visible:
      id: 'today-screen'
    timeout: 45000
